name: Sync Auth to Hugging Face Hub
on:
  push:
    branches: [2-docusaurus-textbook]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: faizanmasood/phycisal_humanoid_auth
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker
          subdirectory: auth
